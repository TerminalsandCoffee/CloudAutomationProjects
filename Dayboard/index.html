<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Dayboard is a simple, private kanban board. Open this file, add a task, and get on with your day.">
  <title>Dayboard — Your local kanban board</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='11' fill='%23704ac2'/%3E%3Cpath d='M11 12v16M20 12v10M29 12v5' stroke='white' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
  <style>
    :root {
      color-scheme:light;
      --bg:#f2eff8; --surface:#fff; --lane:#efebf7; --ink:#30283f; --muted:#756b84; --line:#dfd8eb;
      --accent:#704ac2; --accent-soft:#ece4fc; --on-accent:#fff; --danger:#ac365a; --good:#377962;
      --todo-ink:#885123; --todo-bg:#f8f0e6; --todo-head:#f4d8b8;
      --doing-ink:#6742ad; --doing-bg:#f0eafa; --doing-head:#ded0f7;
      --done-ink:#2c705c; --done-bg:#eaf4ef; --done-head:#c9e7da;
      --shadow:0 2px 0 #30283f08,0 5px 15px #30283f07; --dots:#8265aa16;
    }
    html[data-theme="dark"] {
      color-scheme:dark;
      --bg:#211d2e; --surface:#343044; --lane:#3b334f; --ink:#f5efff; --muted:#b9aecb; --line:#4b415e;
      --accent:#c3a4ff; --accent-soft:#45345f; --on-accent:#281d3d; --danger:#ffa1bd; --good:#96cfb9;
      --todo-ink:#e9bb88; --todo-bg:#302a2e; --todo-head:#493a34;
      --doing-ink:#ccb3ff; --doing-bg:#2f293d; --doing-head:#46355f;
      --done-ink:#a0d5c0; --done-bg:#262f30; --done-head:#304a43;
      --shadow:0 2px 0 #10091f40,0 6px 18px #10091f14; --dots:#cbb6eb12;
    }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background-color:var(--bg); background-image:radial-gradient(var(--dots) .8px,transparent .8px); background-size:18px 18px; color:var(--ink); font:15px/1.5 "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif; }
    button,input,textarea,select { font:inherit; color:inherit; }
    button { cursor:pointer; border:1px solid var(--line); background:var(--surface); border-radius:11px; padding:10px 16px; font-weight:600; transition:background .15s,border-color .15s,box-shadow .15s; }
    button:disabled { cursor:default; opacity:.45; }
    button,input,textarea,select,summary { -webkit-tap-highlight-color:transparent; }
    :focus-visible { outline:3px solid var(--accent); outline-offset:3px; }
    button:hover:not(:disabled) { background:var(--accent-soft); border-color:var(--accent); }
    button.primary { background:var(--accent); border-color:var(--accent); color:var(--on-accent); box-shadow:0 4px 0 color-mix(in srgb,var(--accent),#000 23%); }
    button.primary:hover { background:var(--accent); box-shadow:0 2px 0 color-mix(in srgb,var(--accent),#000 23%); transform:translateY(2px); }
    button.primary:active { box-shadow:none; transform:translateY(4px); }
    button.quiet { background:transparent; border-color:transparent; color:var(--muted); }
    button.danger { color:var(--danger); }
    .icon { width:19px; height:19px; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; flex-shrink:0; vertical-align:middle; }
    .icon-button { width:40px; height:40px; padding:0; display:inline-grid; place-items:center; }
    .button-content { display:inline-flex; gap:8px; align-items:center; }
    [hidden] { display:none !important; }
    .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
    .topbar { min-height:88px; padding:20px 44px; background:var(--surface); border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; gap:20px; }
    .brand { display:flex; align-items:center; gap:13px; }
    .brand-mark { width:43px; height:43px; display:grid; place-items:center; background:var(--accent); color:var(--on-accent); border-radius:14px 14px 14px 4px; box-shadow:3px 3px 0 var(--accent-soft); transform:rotate(-4deg); }
    .brand-mark .icon { width:27px; height:27px; stroke-width:2.5; transform:rotate(4deg); }
    .brand-name { font-family:"Bahnschrift","Segoe UI",sans-serif; font-size:26px; font-weight:700; letter-spacing:-1px; line-height:1.1; }
    .brand-note { font-size:12px; color:var(--muted); margin-top:4px; }
    .top-actions { display:flex; gap:14px; align-items:center; }
    .save-state { display:flex; align-items:center; gap:7px; color:var(--good); font-size:12px; background:var(--done-bg); padding:7px 12px; border-radius:20px; }
    .save-state::before { content:""; width:6px; height:6px; border-radius:50%; background:var(--good); }
    .save-state.warning { color:var(--danger); background:var(--accent-soft); }
    .save-state.warning::before { background:var(--danger); }
    #menu-toggle { background:var(--lane); color:var(--ink); }
    .menu-wrap { position:relative; }
    #board-menu { position:absolute; z-index:10; top:50px; right:0; width:238px; background:var(--surface); border:1px solid var(--line); border-radius:15px; padding:7px; box-shadow:0 16px 40px #281b4928; }
    #board-menu button { display:flex; width:100%; gap:10px; align-items:center; text-align:left; background:transparent; border:0; font-size:13px; padding:12px; }
    #board-menu button:hover { background:var(--lane); }
    .menu-divider { border:0; border-top:1px solid var(--line); margin:5px 8px; }
    main { padding:37px 42px 20px; }
    .board-heading { display:flex; align-items:center; justify-content:space-between; gap:24px; margin:0 2px 29px; }
    h1 { font-family:"Bahnschrift","Segoe UI",sans-serif; font-size:39px; font-weight:650; letter-spacing:-1.6px; margin:0 0 4px; line-height:1.18; }
    #board-summary { font-size:13px; color:var(--muted); margin:0; }
    .board-actions { display:flex; gap:14px; align-items:center; }
    .search { display:flex; gap:8px; align-items:center; position:relative; }
    .search>.icon { position:absolute; left:14px; color:var(--muted); pointer-events:none; width:17px; }
    #search-input { width:236px; border:1px solid var(--line); background:var(--surface); padding:12px 14px 12px 41px; border-radius:11px; font-size:13px; box-shadow:0 2px 0 #30283f04; }
    #search-input::placeholder { color:var(--muted); }
    #notice { display:flex; gap:10px; align-items:center; flex-wrap:wrap; background:var(--accent-soft); border:1px solid var(--line); border-radius:11px; padding:12px 15px; margin-bottom:18px; font-size:13px; }
    #notice.error { color:var(--danger); background:var(--surface); border-color:var(--danger); }
    #notice-text { flex:1; min-width:180px; }
    #notice button { padding:5px 10px; font-size:12px; }
    #board { display:flex; gap:22px; overflow-x:auto; padding:3px 2px 17px; align-items:stretch; min-height:calc(100vh - 306px); scrollbar-color:var(--line) transparent; }
    .column { --stage-ink:var(--todo-ink); --stage-bg:var(--todo-bg); --stage-head:var(--todo-head); flex:1 0 290px; min-width:0; background:var(--stage-bg); border:1px solid color-mix(in srgb,var(--stage-head),var(--line) 40%); border-radius:17px; display:flex; flex-direction:column; box-shadow:0 3px 0 #30283f04; }
    .column:nth-child(3n+2) { --stage-ink:var(--doing-ink); --stage-bg:var(--doing-bg); --stage-head:var(--doing-head); }
    .column:nth-child(3n) { --stage-ink:var(--done-ink); --stage-bg:var(--done-bg); --stage-head:var(--done-head); }
    .column.in-progress { --stage-ink:var(--doing-ink); --stage-bg:var(--doing-bg); --stage-head:var(--doing-head); }
    .column.is-done { --stage-ink:var(--done-ink); --stage-bg:var(--done-bg); --stage-head:var(--done-head); }
    .column-header { padding:16px 17px; display:flex; align-items:center; gap:10px; background:var(--stage-head); border-radius:16px 16px 0 0; border-bottom:1px solid color-mix(in srgb,var(--stage-ink) 10%,transparent); }
    .column-header h2 { font-size:15px; font-weight:700; margin:0; color:var(--stage-ink); }
    .status-mark { width:12px; height:12px; border:2px solid var(--stage-ink); border-radius:4px; flex-shrink:0; }
    .column.in-progress .status-mark { border-radius:50%; background:linear-gradient(90deg,var(--stage-ink) 50%,transparent 50%); }
    .column.is-done .status-mark { border:0; border-radius:50%; background:var(--stage-ink); position:relative; }
    .column.is-done .status-mark::after { content:""; position:absolute; width:5px; height:3px; border-left:1.5px solid var(--stage-head); border-bottom:1.5px solid var(--stage-head); transform:rotate(-45deg); top:3px; left:3px; }
    .count { color:var(--stage-ink); font-size:11px; font-weight:700; min-width:24px; text-align:center; padding:2px 7px; border-radius:7px; background:color-mix(in srgb,var(--surface) 55%,transparent); }
    .column-header .icon-button { margin-left:auto; width:27px; height:27px; border:0; background:transparent; color:var(--stage-ink); border-radius:7px; }
    .column-header .icon-button:hover { background:color-mix(in srgb,var(--surface) 40%,transparent); }
    .column-body { padding:15px 13px 0; flex:1; min-height:225px; display:flex; flex-direction:column; gap:13px; }
    .column.drag-over { border-color:var(--accent); box-shadow:0 0 0 2px var(--accent); }
    .card { position:relative; background:var(--surface); padding:20px 17px 16px; border:1px solid var(--line); border-radius:11px; box-shadow:var(--shadow); cursor:grab; overflow-wrap:anywhere; transition:border-color .15s,box-shadow .15s,transform .15s; }
    .card::before { content:""; position:absolute; top:0; left:17px; width:32px; height:3px; border-radius:0 0 3px 3px; background:var(--stage-head); }
    .card:hover { border-color:var(--stage-ink); box-shadow:0 5px 0 color-mix(in srgb,var(--stage-head) 50%,transparent),0 9px 18px #281b490a; transform:translateY(-2px); }
    .card.dragging { opacity:.42; cursor:grabbing; transform:rotate(-1deg); }
    .card.drop-before { box-shadow:0 -4px 0 var(--accent); }
    .card-title { margin:0; font-weight:650; font-size:14px; line-height:1.6; }
    .is-done .card-title { color:var(--muted); }
    .notes-preview { font-size:12px; line-height:1.7; color:var(--muted); margin:8px 0 0; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; white-space:pre-line; }
    .card-meta { display:flex; gap:7px; align-items:center; flex-wrap:wrap; margin-top:16px; }
    .card-meta:empty { display:none; }
    .tag,.priority,.due { font-size:11px; font-weight:500; padding:3px 8px; border-radius:6px; }
    .tag { background:var(--lane); color:var(--muted); }
    .priority { background:var(--accent-soft); color:var(--accent); }
    .priority.high { color:var(--todo-ink); background:var(--todo-bg); }
    .priority.urgent { color:var(--danger); background:color-mix(in srgb,var(--danger) 12%,var(--surface)); }
    .due { padding-left:0; color:var(--muted); }
    .due.overdue { color:var(--danger); }
    .empty-column { position:relative; text-align:center; padding:52px 16px 36px; color:var(--muted); font-size:12px; pointer-events:none; }
    .empty-column::before { content:""; position:absolute; top:47px; left:50%; width:59px; height:66px; border:1px solid color-mix(in srgb,var(--stage-ink) 15%,var(--stage-head)); border-radius:9px; background:var(--stage-head); transform:translateX(-50%) rotate(-10deg); }
    .empty-column .icon { position:relative; width:59px; height:66px; padding:15px; border:1px solid color-mix(in srgb,var(--stage-head),var(--surface) 40%); border-radius:9px; background:var(--surface); color:var(--stage-ink); margin:0 0 25px; transform:rotate(5deg); box-shadow:2px 4px 0 color-mix(in srgb,var(--stage-head) 70%,transparent); }
    .empty-column strong { display:block; color:var(--stage-ink); font-size:14px; font-weight:600; margin-bottom:7px; }
    .empty-column p { margin:0; max-width:25ch; margin-inline:auto; line-height:1.7; }
    .column-footer { padding:16px 13px; }
    .add-card-btn { display:flex; justify-content:center; align-items:center; gap:7px; background:color-mix(in srgb,var(--surface) 45%,transparent); border:1px dashed color-mix(in srgb,var(--stage-ink) 30%,transparent); text-align:left; width:100%; color:var(--stage-ink); padding:10px; font-size:13px; font-weight:600; border-radius:9px; }
    .column .add-card-btn:hover { color:var(--stage-ink); background:var(--stage-head); border-color:var(--stage-ink); }
    footer { color:var(--muted); display:flex; gap:15px; justify-content:space-between; padding:0 44px 23px; font-size:11px; }
    footer p { margin:0; }
    kbd { font:inherit; padding:2px 5px; border:1px solid var(--line); border-bottom-width:2px; border-radius:5px; background:var(--surface); }
    dialog { padding:0; width:510px; max-width:calc(100% - 32px); max-height:calc(100dvh - 40px); background:var(--surface); color:var(--ink); border:1px solid var(--line); border-radius:19px; box-shadow:0 30px 100px #21133150; }
    dialog::backdrop { background:#251b3a80; backdrop-filter:blur(5px); }
    .dialog-header { display:flex; gap:15px; align-items:center; justify-content:space-between; padding:22px 25px 18px; background:var(--accent-soft); margin-bottom:22px; border-bottom:1px solid var(--line); }
    .dialog-header h2 { font-family:"Bahnschrift","Segoe UI",sans-serif; font-size:22px; letter-spacing:-.5px; margin:0; }
    .dialog-body { padding:0 25px 23px; }
    .field { display:flex; flex-direction:column; gap:7px; margin-bottom:16px; min-width:0; }
    .field label { font-size:12px; font-weight:600; }
    .field input,.field textarea,.field select { width:100%; background:var(--bg); border:1px solid var(--line); border-radius:9px; padding:11px 12px; font-size:14px; }
    .field textarea { min-height:115px; resize:vertical; line-height:1.6; }
    .field-row { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
    .optional { font-weight:400; color:var(--muted); }
    details { border-top:1px solid var(--line); padding-top:12px; }
    details summary { font-size:12px; color:var(--accent); cursor:pointer; }
    details[open] summary { margin-bottom:17px; }
    .dialog-actions { padding:17px 25px 21px; background:var(--bg); border-top:1px solid var(--line); display:flex; align-items:center; gap:9px; }
    .dialog-actions .spacer { flex:1; }
    .help-text { font-size:12px; color:var(--muted); margin:0; }
    @media (min-width:1550px) { main { padding-inline:64px; } .topbar { padding-inline:66px; } footer { padding-inline:66px; } }
    @media (max-width:700px) {
      .topbar { padding:18px 20px; min-height:80px; } .brand-note { display:none; } .brand-name { font-size:25px; } .brand { gap:10px; } .brand-mark { width:37px; height:37px; }
      .top-actions { gap:8px; } .save-state { font-size:10px; padding:6px 8px; gap:5px; } #menu-toggle { width:34px; height:34px; }
      main { padding:28px 16px 15px; } .board-heading { align-items:flex-start; flex-direction:column; gap:20px; margin-bottom:25px; } h1 { font-size:34px; }
      .board-actions { width:100%; gap:10px; } .search { flex:1; min-width:0; } #search-input { width:100%; } .board-actions>.primary { flex-shrink:0; padding:10px 13px; }
      #board { min-height:calc(100dvh - 343px); gap:14px; scroll-snap-type:x proximity; } .column { flex-basis:calc(100vw - 60px); scroll-snap-align:start; }
      footer { padding:0 20px 18px; } .keyboard-hint { display:none; } .empty-column { padding-top:45px; } .empty-column::before { top:40px; }
    }
    @media (max-width:370px) { .brand-name { font-size:21px; } .topbar { padding-inline:16px; } .save-state { max-width:99px; line-height:1.3; border-radius:9px; } }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { scroll-behavior:auto !important; transition:none !important; } .card:hover,.card.dragging,button.primary:hover,button.primary:active { transform:none; } }
    /* Daily principle strip */
    .quote-bar { display:flex; gap:13px; align-items:center; background:var(--surface); border:1px solid var(--line); border-left:4px solid var(--accent); border-radius:12px; padding:13px 17px; margin-bottom:18px; box-shadow:var(--shadow); }
    .quote-bar .icon { color:var(--accent); width:22px; height:22px; flex-shrink:0; }
    .quote-bar-text { min-width:0; }
    .quote-bar q { font-size:14px; font-weight:600; font-style:italic; quotes:"\201C" "\201D"; }
    .quote-bar .quote-cite { display:block; font-size:11px; color:var(--muted); margin-top:3px; font-style:normal; }
    /* Week calendar */
    .week { background:var(--surface); border:1px solid var(--line); border-radius:17px; box-shadow:var(--shadow); margin-bottom:24px; overflow:hidden; }
    .week-header { display:flex; align-items:center; gap:12px; padding:15px 18px; background:var(--accent-soft); border-bottom:1px solid var(--line); }
    .week-header .icon { color:var(--accent); }
    .week-title { font-family:"Bahnschrift","Segoe UI",sans-serif; font-size:17px; font-weight:700; letter-spacing:-.4px; margin:0; }
    .week-range { font-size:12px; color:var(--muted); margin-left:2px; }
    .week-nav { display:flex; gap:6px; align-items:center; margin-left:auto; }
    .week-nav .icon-button { width:34px; height:34px; border:1px solid var(--line); background:var(--surface); }
    #week-today-btn { padding:8px 13px; font-size:12px; border:1px solid var(--line); background:var(--surface); }
    #add-event-btn { padding:8px 14px; font-size:12px; }
    .week-grid { display:grid; grid-template-columns:repeat(7,1fr); }
    .week-day { border-right:1px solid var(--line); padding:11px 10px 13px; min-height:118px; display:flex; flex-direction:column; gap:7px; }
    .week-day:last-child { border-right:0; }
    .week-day.is-weekend { background:color-mix(in srgb,var(--lane) 45%,transparent); }
    .week-day.is-today { background:var(--accent-soft); }
    .week-day-label { display:flex; align-items:baseline; gap:6px; font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.4px; }
    .week-day-label .dnum { font-size:16px; font-weight:700; color:var(--ink); letter-spacing:0; text-transform:none; }
    .week-day.is-today .dnum { color:var(--accent); }
    .week-day-add { margin-top:auto; border:1px dashed color-mix(in srgb,var(--accent) 35%,transparent); background:transparent; color:var(--muted); border-radius:8px; padding:6px; font-size:11px; font-weight:600; opacity:0; transition:opacity .12s; }
    .week-day:hover .week-day-add,.week-day-add:focus-visible { opacity:1; }
    .week-day-add:hover { color:var(--accent); border-color:var(--accent); background:color-mix(in srgb,var(--accent) 8%,transparent); }
    .event { text-align:left; width:100%; border:1px solid var(--line); background:var(--bg); border-radius:9px; padding:7px 9px; font-weight:600; font-size:12px; line-height:1.35; display:flex; flex-direction:column; gap:2px; overflow-wrap:anywhere; }
    .event:hover { border-color:var(--accent); background:var(--accent-soft); }
    .event.is-past { opacity:.55; }
    .event-time { font-size:10px; font-weight:700; color:var(--accent); letter-spacing:.3px; }
    .event-time .allday { color:var(--muted); }
    @media (max-width:900px) {
      .week-grid { grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); }
      .week-day { border-right:0; border-bottom:1px solid var(--line); }
    }
    @media (max-width:700px) { .quote-bar { margin-bottom:16px; } .week { margin-bottom:20px; } .week-header { flex-wrap:wrap; } .week-nav { margin-left:0; } }
  </style>
</head>

  <header class="topbar">
    <div class="brand"><div class="brand-mark"><svg class="icon" aria-hidden="true"><use href="#i-board"/></svg></div><div><div class="brand-name">Dayboard</div><div class="brand-note">A little space to get things done.</div></div></div>
    <div class="top-actions">
      <span class="save-state" id="save-state" role="status">Saved in this browser</span>
      <div class="menu-wrap">
        <button class="icon-button quiet" id="menu-toggle" aria-label="Board options" aria-expanded="false" aria-controls="board-menu"><svg class="icon" aria-hidden="true"><use href="#i-more"/></svg></button>
        <div id="board-menu" hidden>
          <button id="add-column-btn"><svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg>Add column</button>
          <button id="theme-toggle"><svg class="icon" aria-hidden="true"><use href="#i-theme"/></svg><span id="theme-label">Use dark appearance</span></button>
          <hr class="menu-divider">
          <button id="export-btn"><svg class="icon" aria-hidden="true"><use href="#i-down"/></svg>Export backup</button>
          <button id="import-btn"><svg class="icon" aria-hidden="true"><use href="#i-up"/></svg>Import backup</button>
          <button id="recover-scrum-btn" hidden><svg class="icon" aria-hidden="true"><use href="#i-down"/></svg>Export old Scrum board</button>
        </div>
      </div>
    </div>
  </header>
  <main>
    <div class="board-heading"><div><h1>Your board</h1><p id="board-summary">Everything in one place.</p></div><div class="board-actions">
      <label class="search"><span class="sr-only">Search tasks</span><svg class="icon" aria-hidden="true"><use href="#i-search"/></svg><input type="search" id="search-input" placeholder="Search tasks" autocomplete="off"></label>
      <button class="primary button-content" id="new-task-btn"><svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg>New task</button>
    </div></div>
    <div id="notice" role="status" hidden><span id="notice-text"></span><button id="undo-btn" hidden>Undo</button><button id="dismiss-notice" class="quiet" aria-label="Dismiss message">Dismiss</button></div>
    <div class="quote-bar" id="quote-bar" hidden><svg class="icon" aria-hidden="true"><use href="#i-quote"/></svg><div class="quote-bar-text"><q id="quote-text"></q><cite class="quote-cite" id="quote-cite"></cite></div></div>
    <section class="week" aria-label="This week">
      <div class="week-header">
        <svg class="icon" aria-hidden="true"><use href="#i-calendar"/></svg>
        <h2 class="week-title" id="week-title">This week</h2><span class="week-range" id="week-range"></span>
        <div class="week-nav">
          <button class="quiet" id="week-today-btn">Today</button>
          <button class="icon-button quiet" id="week-prev" aria-label="Previous week"><svg class="icon" aria-hidden="true"><use href="#i-left"/></svg></button>
          <button class="icon-button quiet" id="week-next" aria-label="Next week"><svg class="icon" aria-hidden="true"><use href="#i-right"/></svg></button>
          <button class="primary button-content" id="add-event-btn"><svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg>Add event</button>
        </div>
      </div>
      <div class="week-grid" id="week-grid"></div>
    </section>
    <div id="board" aria-label="Kanban board"></div>
  </main>
  <footer><p>Only in this browser. Export a backup to keep a copy.</p><p class="keyboard-hint"><kbd>N</kbd> New task &nbsp; <kbd>E</kbd> New event &nbsp; <kbd>/</kbd> Search &nbsp; Drag cards to move them</p></footer>
  <input type="file" id="import-input" accept=".json,application/json" hidden>
  <dialog id="card-modal" aria-labelledby="modal-heading">
    <form id="card-form">
      <div class="dialog-header"><h2 id="modal-heading">New task</h2><button type="button" class="icon-button quiet" data-close="card-modal" aria-label="Close task"><svg class="icon" aria-hidden="true"><use href="#i-close"/></svg></button></div>
      <div class="dialog-body">
        <div class="field"><label for="f-title">Task</label><input id="f-title" maxlength="200" placeholder="What needs to get done?" required autocomplete="off"></div>
        <div class="field"><label for="f-notes">Notes <span class="optional">(optional)</span></label><textarea id="f-notes" maxlength="4000" placeholder="A few details, links, or next steps…"></textarea></div>
        <div class="field"><label for="f-column">Column</label><select id="f-column"></select></div>
        <details id="task-details"><summary>Priority, due date &amp; tags</summary>
          <div class="field-row"><div class="field"><label for="f-priority">Priority</label><select id="f-priority"><option value="low">Low</option><option value="medium" selected>Normal</option><option value="high">High</option><option value="urgent">Urgent</option></select></div><div class="field"><label for="f-due">Due date</label><input type="date" id="f-due" max="9999-12-31"></div></div>
          <div class="field"><label for="f-tags">Tags</label><input id="f-tags" maxlength="500" placeholder="Separate tags with commas"></div>
        </details>
      </div>
      <div class="dialog-actions"><button type="button" class="quiet danger" id="delete-card-btn">Delete task</button><span class="spacer"></span><button type="button" class="quiet" id="cancel-card-btn" data-close="card-modal">Cancel</button><button type="submit" class="primary" id="save-card-btn">Save task</button></div>
    </form>
  </dialog>
  <dialog id="column-modal" aria-labelledby="column-heading">
    <form id="column-form">
      <div class="dialog-header"><h2 id="column-heading">Edit column</h2><button type="button" class="icon-button quiet" data-close="column-modal" aria-label="Close column"><svg class="icon" aria-hidden="true"><use href="#i-close"/></svg></button></div>
      <div class="dialog-body"><div class="field"><label for="column-name">Column name</label><input id="column-name" required maxlength="60" autocomplete="off"></div><div class="field" id="column-position-field"><label for="column-position">Position</label><select id="column-position"></select></div><p class="help-text" id="column-help"></p></div>
      <div class="dialog-actions"><button type="button" class="quiet danger" id="delete-column-btn">Delete column</button><span class="spacer"></span><button type="button" class="quiet" data-close="column-modal">Cancel</button><button type="submit" class="primary">Save column</button></div>
    </form>
  </dialog>
  <dialog id="event-modal" aria-labelledby="event-heading">
    <form id="event-form">
      <div class="dialog-header"><h2 id="event-heading">New event</h2><button type="button" class="icon-button quiet" data-close="event-modal" aria-label="Close event"><svg class="icon" aria-hidden="true"><use href="#i-close"/></svg></button></div>
      <div class="dialog-body">
        <div class="field"><label for="e-title">Event</label><input id="e-title" maxlength="200" placeholder="Call with…" required autocomplete="off"></div>
        <div class="field-row"><div class="field"><label for="e-date">Date</label><input type="date" id="e-date" max="9999-12-31" required></div><div class="field"><label for="e-time">Time <span class="optional">(optional)</span></label><input type="time" id="e-time"></div></div>
        <div class="field"><label for="e-notes">Notes <span class="optional">(optional)</span></label><textarea id="e-notes" maxlength="4000" placeholder="Link, dial-in, agenda…"></textarea></div>
      </div>
      <div class="dialog-actions"><button type="button" class="quiet danger" id="delete-event-btn">Delete event</button><span class="spacer"></span><button type="button" class="quiet" data-close="event-modal">Cancel</button><button type="submit" class="primary">Save event</button></div>
    </form>
  </dialog>
  <script>
  (() => {
    'use strict';
    // Retain the original key and path so existing Kanban work opens here unchanged.
    const STORAGE_KEY = 'raf-board-v1-kanban';
    const LEGACY_KEY = 'raf-board-v1';
    const THEME_KEY = 'raf-board-theme';
    const $ = id => document.getElementById(id);
    const uid = prefix => prefix + '_' + (globalThis.crypto?.randomUUID?.() || Date.now().toString(36) + Math.random().toString(36).slice(2));
    let state, editingCardId = null, editingColumnId = null, draggingId = null, undoState = null;
    let storageBlocked = false, unsaved = false, restoreFocus = null;

    function blankBoard() {
      return { columns: [{ id:uid('col'), name:'To do' }, { id:uid('col'), name:'In progress' }, { id:uid('col'), name:'Done', done:true }], cards:[] };
    }

    function validateBoard(value) {
      if (!value || !Array.isArray(value.columns) || !value.columns.length || !Array.isArray(value.cards)) throw new Error('Choose a board backup with at least one column.');
      const columnIds = new Set(), cardIds = new Set();
      const columns = value.columns.map(column => {
        if (!column || typeof column.id !== 'string' || !column.id || columnIds.has(column.id) || typeof column.name !== 'string' || !column.name.trim()) throw new Error('The backup contains an invalid or duplicate column.');
        columnIds.add(column.id);
        return { ...column, name:column.name.trim() };
      });
      const cards = value.cards.map(card => {
        if (!card || typeof card.id !== 'string' || !card.id || cardIds.has(card.id) || typeof card.title !== 'string' || !card.title.trim() || !columnIds.has(card.columnId)) throw new Error('A task is invalid, duplicated, or belongs to a missing column.');
        if (card.notes != null && typeof card.notes !== 'string') throw new Error('Task notes must be text.');
        if (card.tags != null && (!Array.isArray(card.tags) || card.tags.some(tag => typeof tag !== 'string'))) throw new Error('Task tags must be a list of text labels.');
        if (card.due && (typeof card.due !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(card.due) || !Number.isFinite(Date.parse(card.due)))) throw new Error('A task has an invalid due date.');
        cardIds.add(card.id);
        return { ...card, notes:card.notes || '', tags:card.tags || [], due:card.due || '', priority:['low','medium','high','urgent'].includes(card.priority) ? card.priority : 'medium' };
      });
      return { columns, cards };
    }

    function announce(message, error = false, canUndo = false) {
      $('notice-text').textContent = message;
      $('notice').classList.toggle('error', error);
      $('notice').hidden = false;
      $('undo-btn').hidden = !canUndo;
    }

    function load() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY) ?? localStorage.getItem(LEGACY_KEY);
        state = raw ? validateBoard(JSON.parse(raw)) : blankBoard();
      } catch (error) {
        state = blankBoard();
        storageBlocked = true;
        unsaved = true;
        announce('Your saved board could not be read. Its stored data has been left untouched. Import a valid backup to restore it; export any new work before closing.', true);
      }
      try {
        const theme = localStorage.getItem(THEME_KEY);
        if (theme === 'dark' || theme === 'light') document.documentElement.dataset.theme = theme;
        $('recover-scrum-btn').hidden = !localStorage.getItem('raf-board-v1-scrum');
      } catch {}
      updateSaveStatus();
      updateThemeLabel();
    }

    function updateSaveStatus() {
      $('save-state').textContent = unsaved ? 'Not saved — export a backup' : 'Saved in this browser';
      $('save-state').classList.toggle('warning', unsaved);
    }

    function persist() {
      try {
        if (storageBlocked) throw new Error('Previous data could not be read');
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        unsaved = false;
      } catch {
        unsaved = true;
        announce('This board could not be saved in your browser. Your changes are still here — export a backup before closing this page.', true, !!undoState);
      }
      updateSaveStatus();
    }

    function commit(next, message = '', undo = false) {
      undoState = undo ? structuredClone(state) : null;
      state = next;
      $('notice').hidden = true;
      if (message) announce(message, false, undo);
      persist();
      render();
    }

    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text != null) node.textContent = text;
      return node;
    }

    function icon(name) {
      const node = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      node.setAttribute('class', 'icon'); node.setAttribute('aria-hidden', 'true');
      const use = document.createElementNS('http://www.w3.org/2000/svg', 'use');
      use.setAttribute('href', '#i-' + name); node.append(use); return node;
    }

    const isDone = column => column.done === true || /^(done|complete|completed)$/i.test(column.name.trim());
    function today() {
      const date = new Date();
      return date.getFullYear() + '-' + String(date.getMonth()+1).padStart(2,'0') + '-' + String(date.getDate()).padStart(2,'0');
    }

    function cardElement(card, column) {
      const node = el('article', 'card');
      node.draggable = true; node.tabIndex = 0; node.dataset.cardId = card.id;
      node.setAttribute('role', 'button'); node.setAttribute('aria-label', 'Edit task: ' + card.title);
      node.append(el('p', 'card-title', card.title));
      if (card.notes) node.append(el('p', 'notes-preview', card.notes));
      const meta = el('div', 'card-meta');
      if (card.priority !== 'medium') meta.append(el('span', 'priority ' + card.priority, card.priority[0].toUpperCase() + card.priority.slice(1)));
      if (card.due) {
        const overdue = !isDone(column) && card.due < today();
        const label = card.due === today() ? 'Today' : new Date(card.due + 'T12:00:00').toLocaleDateString(undefined,{ month:'short',day:'numeric' });
        const due = el('span','due' + (overdue ? ' overdue' : ''),(overdue ? 'Overdue · ' : '') + label);
        due.title = card.due; meta.append(due);
      }
      card.tags.forEach(tag => meta.append(el('span','tag',tag)));
      node.append(meta);
      node.addEventListener('click', () => { if (!draggingId) openCard(card.id); });
      node.addEventListener('keydown', event => {
        if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); openCard(card.id); }
      });
      node.addEventListener('dragstart', event => {
        draggingId = card.id; event.dataTransfer.effectAllowed = 'move';
        event.dataTransfer.setData('text/plain', card.id); node.classList.add('dragging');
      });
      node.addEventListener('dragend', () => { draggingId = null; clearDrag(); node.classList.remove('dragging'); });
      return node;
    }

    function render() {
      const query = $('search-input').value.trim().toLowerCase();
      let visibleCount = 0;
      const fragment = document.createDocumentFragment();
      state.columns.forEach((column, index) => {
        const lane = el('section','column' + (isDone(column) ? ' is-done' : /in progress/i.test(column.name) ? ' in-progress' : ''));
        lane.dataset.colId = column.id;
        lane.setAttribute('aria-label', column.name);
        const header = el('div','column-header');
        const mark = el('span','status-mark'); mark.setAttribute('aria-hidden','true');
        const cards = state.cards.filter(card => card.columnId === column.id);
        const visible = cards.filter(card => !query || [card.title,card.notes,...card.tags].join(' ').toLowerCase().includes(query));
        visibleCount += visible.length;
        header.append(mark,el('h2','',column.name),el('span','count',query ? visible.length + '/' + cards.length : cards.length));
        const options = el('button','icon-button'); options.append(icon('more'));
        options.setAttribute('aria-label','Edit column: ' + column.name);
        options.addEventListener('click', () => openColumn(column.id)); header.append(options);
        const body = el('div','column-body'); body.dataset.colId = column.id;
        visible.forEach(card => body.append(cardElement(card,column)));
        if (!visible.length) {
          const empty = el('div','empty-column');
          const emptyIcon = query ? 'search' : isDone(column) ? 'check' : index === 0 ? 'plus' : 'progress';
          empty.append(icon(emptyIcon));
          empty.append(el('strong','',query ? 'No matching tasks' : index === 0 ? 'Start with one thing' : isDone(column) ? 'A place for finished work' : 'Ready when you are'));
          empty.append(el('p','',query ? 'Try another search.' : index === 0 ? 'Add a task below. The rest can follow.' : isDone(column) ? 'Move tasks here as you finish them.' : 'Move a task here when you get started.'));
          body.append(empty);
        }
        // Dragging only moves the dragged record in state. Hidden cards never depend on the filtered DOM.
        lane.addEventListener('dragover', event => {
          if (!draggingId) return;
          event.preventDefault(); event.dataTransfer.dropEffect = 'move'; clearDrag(); lane.classList.add('drag-over');
          const before = dropTarget(body,event.clientY);
          if (before) before.classList.add('drop-before');
        });
        lane.addEventListener('dragleave', event => { if (!lane.contains(event.relatedTarget)) clearDrag(); });
        lane.addEventListener('drop', event => {
          if (!draggingId) return;
          event.preventDefault();
          const before = dropTarget(body,event.clientY);
          const card = state.cards.find(item => item.id === draggingId);
          if (!card) return;
          const next = structuredClone(state);
          next.cards = next.cards.filter(item => item.id !== draggingId);
          const moved = { ...card,columnId:column.id };
          let position = before ? next.cards.findIndex(item => item.id === before.dataset.cardId) : -1;
          if (position < 0) { const last = next.cards.map(item => item.columnId).lastIndexOf(column.id); position = last < 0 ? next.cards.length : last + 1; }
          next.cards.splice(position,0,moved); draggingId = null; clearDrag();
          commit(next,'Task moved to ' + column.name + '.');
        });
        const footer = el('div','column-footer');
        const add = el('button','add-card-btn'); add.append(icon('plus'),document.createTextNode('Add task'));
        add.setAttribute('aria-label','Add task to ' + column.name);
        add.addEventListener('click', () => openCard(null,column.id)); footer.append(add);
        lane.append(header,body,footer); fragment.append(lane);
      });
      $('board').replaceChildren(fragment);
      const doneIds = new Set(state.columns.filter(isDone).map(column => column.id));
      const doneCount = state.cards.filter(card => doneIds.has(card.columnId)).length;
      $('board-summary').textContent = query ? visibleCount + ' of ' + state.cards.length + ' tasks match your search' : !state.cards.length ? 'Everything in one place. One task at a time.' : (state.cards.length - doneCount) + ' open · ' + doneCount + ' done';
    }

    function dropTarget(body, y) {
      return Array.from(body.querySelectorAll('.card')).find(node => node.dataset.cardId !== draggingId && y < node.getBoundingClientRect().top + node.getBoundingClientRect().height / 2);
    }
    function clearDrag() { document.querySelectorAll('.drag-over,.drop-before').forEach(node => node.classList.remove('drag-over','drop-before')); }

    function showDialog(id) {
      restoreFocus = document.activeElement.closest('#board-menu') ? $('menu-toggle') : document.activeElement;
      closeMenu(); $(id).showModal();
    }
    function closeDialog(id) {
      $(id).close();
      if (restoreFocus?.isConnected && restoreFocus.getClientRects().length) restoreFocus.focus(); else $('new-task-btn').focus();
    }

    function openCard(id, columnId) {
      const card = state.cards.find(item => item.id === id);
      editingCardId = card?.id || null;
      $('card-form').reset();
      $('modal-heading').textContent = card ? 'Edit task' : 'New task';
      $('f-title').value = card?.title || '';
      $('f-title').setCustomValidity('');
      $('f-notes').value = card?.notes || '';
      $('f-priority').value = card?.priority || 'medium';
      $('f-due').value = card?.due || '';
      $('f-tags').value = (card?.tags || []).join(', ');
      $('f-column').replaceChildren(...state.columns.map(column => new Option(column.name,column.id)));
      $('f-column').value = card?.columnId || columnId || state.columns[0].id;
      $('task-details').open = !!(card && (card.due || card.tags.length || card.priority !== 'medium'));
      $('delete-card-btn').hidden = !card;
      showDialog('card-modal'); $('f-title').focus();
    }

    $('card-form').addEventListener('submit', event => {
      event.preventDefault();
      if (!$('card-modal').open) return;
      const title = $('f-title').value.trim();
      if (!title) { $('f-title').setCustomValidity('Give this task a name.'); $('f-title').reportValidity(); return; }
      const next = structuredClone(state), old = next.cards.find(card => card.id === editingCardId);
      const card = { ...(old || { id:uid('card'),created:Date.now() }),title,notes:$('f-notes').value,priority:$('f-priority').value,due:$('f-due').value,columnId:$('f-column').value,tags:$('f-tags').value.split(',').map(tag => tag.trim()).filter(Boolean) };
      if (old) next.cards[next.cards.indexOf(old)] = card; else next.cards.push(card);
      // A newly added task should be visible even if the previous view was filtered.
      if (!old) $('search-input').value = '';
      commit(next); closeDialog('card-modal');
    });
    $('f-title').addEventListener('input', () => $('f-title').setCustomValidity(''));
    $('delete-card-btn').addEventListener('click', () => {
      const next = structuredClone(state); next.cards = next.cards.filter(card => card.id !== editingCardId);
      commit(next,'Task deleted.',true); closeDialog('card-modal');
    });

    function openColumn(id) {
      const column = state.columns.find(item => item.id === id);
      editingColumnId = column?.id || null;
      $('column-heading').textContent = column ? 'Edit column' : 'New column';
      $('column-name').value = column?.name || ''; $('column-name').setCustomValidity('');
      $('column-position').replaceChildren(...state.columns.map((item,index) => new Option((index+1) + (item.id === id ? ' (current)' : ''),index)));
      $('column-position').value = state.columns.findIndex(item => item.id === id);
      $('column-position-field').hidden = !column;
      $('delete-column-btn').hidden = !column;
      $('delete-column-btn').disabled = state.columns.length === 1;
      const target = state.columns.find(item => item.id !== id);
      $('column-help').textContent = column ? target ? 'Deleting this column moves its tasks to “' + target.name + '”.' : 'Keep at least one column on your board.' : 'Give this stage of your work a short name.';
      showDialog('column-modal'); $('column-name').focus();
    }
    $('column-name').addEventListener('input', () => $('column-name').setCustomValidity(''));
    $('column-form').addEventListener('submit', event => {
      event.preventDefault();
      if (!$('column-modal').open) return;
      const name = $('column-name').value.trim();
      if (!name) { $('column-name').setCustomValidity('Give this column a name.'); $('column-name').reportValidity(); return; }
      const next = structuredClone(state), column = next.columns.find(item => item.id === editingColumnId);
      if (column) {
        const done = isDone(column); column.name = name;
        if (done) column.done = true;
        next.columns = next.columns.filter(item => item.id !== column.id);
        next.columns.splice(Number($('column-position').value),0,column);
      } else next.columns.push({ id:uid('col'),name });
      commit(next); closeDialog('column-modal');
    });
    $('delete-column-btn').addEventListener('click', () => {
      if (state.columns.length <= 1) return;
      const next = structuredClone(state); next.columns = next.columns.filter(column => column.id !== editingColumnId);
      next.cards.forEach(card => { if (card.columnId === editingColumnId) card.columnId = next.columns[0].id; });
      commit(next,'Column deleted. Its tasks were moved to ' + next.columns[0].name + '.',true); closeDialog('column-modal');
    });

    function closeMenu() { $('board-menu').hidden = true; $('menu-toggle').setAttribute('aria-expanded','false'); }
    $('menu-toggle').addEventListener('click', () => {
      const open = $('board-menu').hidden; $('board-menu').hidden = !open; $('menu-toggle').setAttribute('aria-expanded',String(open));
    });
    document.addEventListener('click', event => { if (!event.target.closest('.menu-wrap')) closeMenu(); });
    $('new-task-btn').addEventListener('click', () => openCard(null));
    $('add-column-btn').addEventListener('click', () => openColumn(null));
    $('search-input').addEventListener('input',render);
    function updateThemeLabel() { $('theme-label').textContent = document.documentElement.dataset.theme === 'dark' ? 'Use light appearance' : 'Use dark appearance'; }
    $('theme-toggle').addEventListener('click', () => {
      const theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
      document.documentElement.dataset.theme = theme;
      try { localStorage.setItem(THEME_KEY,theme); } catch {}
      updateThemeLabel(); closeMenu();
    });

    function download(data, filename) {
      const url = URL.createObjectURL(new Blob([data],{ type:'application/json' }));
      const link = el('a'); link.href = url; link.download = filename;
      document.body.append(link); link.click(); link.remove(); setTimeout(() => URL.revokeObjectURL(url),1000);
    }
    $('export-btn').addEventListener('click', () => { download(JSON.stringify({ ...state, events },null,2),'dayboard-backup-' + today() + '.json'); closeMenu(); });
    $('recover-scrum-btn').addEventListener('click', () => {
      try { const raw = localStorage.getItem('raf-board-v1-scrum'); if (raw) download(raw,'previous-scrum-board-' + today() + '.json'); }
      catch { announce('Your old board could not be read from browser storage.',true); }
      closeMenu();
    });
    $('import-btn').addEventListener('click', () => { closeMenu(); $('import-input').click(); });
    $('import-input').addEventListener('change', async event => {
      const file = event.target.files[0]; if (!file) return;
      try {
        const parsed = JSON.parse(await file.text());
        const imported = validateBoard(parsed);
        if (!confirm('Replace your current board with this backup? You can undo the import until your next change.')) return;
        storageBlocked = false; $('search-input').value = '';
        if ('events' in parsed) { events = sanitizeEvents(parsed.events); persistEvents(); renderWeek(); }
        commit(imported,'Backup imported.',true);
      } catch (error) { announce('Could not import this backup. ' + error.message,true); }
      finally { event.target.value = ''; }
    });
    $('undo-btn').addEventListener('click', () => { if (undoState) { const previous = undoState; undoState = null; commit(previous,'Change undone.'); } });
    $('dismiss-notice').addEventListener('click', () => { $('notice').hidden = true; });
    document.querySelectorAll('[data-close]').forEach(button => button.addEventListener('click', () => closeDialog(button.dataset.close)));
    document.querySelectorAll('dialog').forEach(dialog => {
      dialog.addEventListener('cancel', event => { event.preventDefault(); closeDialog(dialog.id); });
    });
    document.addEventListener('keydown', event => {
      if (document.querySelector('dialog[open]')) return;
      if (event.key === 'Escape') { if (!$('board-menu').hidden) { closeMenu(); $('menu-toggle').focus(); } return; }
      if (event.ctrlKey || event.metaKey || event.altKey || event.target.closest('input,textarea,select,[contenteditable="true"]')) return;
      if (event.key === '/') { event.preventDefault(); $('search-input').focus(); }
      if (event.key.toLowerCase() === 'n') { event.preventDefault(); openCard(null); }
      if (event.key.toLowerCase() === 'e') { event.preventDefault(); openEvent(null); }
    });
    window.addEventListener('beforeunload', event => { if (unsaved) { event.preventDefault(); event.returnValue = ''; } });

    /* ---- Calendar events + daily principle ---------------------------- */
    const EVENTS_KEY = 'raf-dayboard-events-v1';
    const DAY_MS = 86400000;
    let events = [], weekOffset = 0, editingEventId = null;

    // Short principles in the spirit of The Confident Mind (Nate Zinsser).
    const PRINCIPLES = [
      'Confidence is a choice about what to think, not a feeling you wait for.',
      'Protect your confidence like the priceless asset it is — guard what you let in.',
      'Deposit every small win into your bank of confidence. It compounds.',
      'Judge your effort, not the outcome. The effort is the part you own.',
      'Control the controllables. Let go of the rest before it rents space in your head.',
      'What you replay, you reinforce. Replay the reps that went right.',
      'Prepare hard, then trust the preparation and let it flow.',
      'Doubt is optional. You decide what evidence you accept about yourself.',
      'First job before performing: build the belief that you belong here.',
      'Treat a mistake as information, not identity. Note it, adjust, move on.',
      'The next play is the only one that matters. Reset and step in.',
      'Talk to yourself the way you would coach someone you believe in.',
      'Certainty is manufactured on purpose — rehearse it before you need it.',
      'End the day by banking three things you did well. Small counts.',
      'Nerves are just energy. Rename them "ready" and put them to work.',
      'You are always one thought away from playing free again.'
    ];
    function renderQuote() {
      const day = Math.floor(Date.parse(today() + 'T00:00:00') / DAY_MS);
      $('quote-text').textContent = PRINCIPLES[((day % PRINCIPLES.length) + PRINCIPLES.length) % PRINCIPLES.length];
      $('quote-cite').textContent = '— The Confident Mind, Nate Zinsser';
      $('quote-bar').hidden = false;
    }

    function sanitizeEvents(list) {
      if (!Array.isArray(list)) return [];
      return list.filter(item => item && typeof item.title === 'string' && item.title.trim() && typeof item.date === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(item.date))
        .map(item => ({ id:(typeof item.id === 'string' && item.id) ? item.id : uid('evt'), title:item.title.trim().slice(0,200), date:item.date, time:(typeof item.time === 'string' && /^\d{2}:\d{2}$/.test(item.time)) ? item.time : '', notes:typeof item.notes === 'string' ? item.notes.slice(0,4000) : '' }));
    }
    function loadEvents() { try { events = sanitizeEvents(JSON.parse(localStorage.getItem(EVENTS_KEY) || '[]')); } catch { events = []; } }
    function persistEvents() { try { localStorage.setItem(EVENTS_KEY, JSON.stringify(events)); } catch {} }

    function parseLocalDate(str) { const [y,m,d] = str.split('-').map(Number); return new Date(y, m-1, d); }
    function toISODate(date) { return date.getFullYear() + '-' + String(date.getMonth()+1).padStart(2,'0') + '-' + String(date.getDate()).padStart(2,'0'); }
    function mondayOf(date) { const copy = new Date(date.getFullYear(), date.getMonth(), date.getDate()); copy.setDate(copy.getDate() - ((copy.getDay() + 6) % 7)); return copy; }
    function nowHHMM() { const d = new Date(); return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0'); }
    function formatTime(hhmm) {
      const [h,m] = hhmm.split(':').map(Number);
      const date = new Date(); date.setHours(h, m, 0, 0);
      return date.toLocaleTimeString(undefined, { hour:'numeric', minute:'2-digit' });
    }

    function renderWeek() {
      const grid = $('week-grid'); if (!grid) return;
      const base = mondayOf(new Date()); base.setDate(base.getDate() + weekOffset * 7);
      const todayIso = today(), currentHHMM = nowHHMM();
      const days = Array.from({ length:7 }, (_, i) => { const d = new Date(base); d.setDate(base.getDate() + i); return d; });
      const first = days[0], last = days[6], monthDay = { month:'short', day:'numeric' };
      $('week-range').textContent = first.toLocaleDateString(undefined, monthDay) + ' – ' + last.toLocaleDateString(undefined, first.getMonth() === last.getMonth() ? { day:'numeric' } : monthDay) + ', ' + last.getFullYear();
      $('week-title').textContent = weekOffset === 0 ? 'This week' : weekOffset === 1 ? 'Next week' : weekOffset === -1 ? 'Last week' : 'Week of ' + first.toLocaleDateString(undefined, monthDay);
      const fragment = document.createDocumentFragment();
      days.forEach(date => {
        const iso = toISODate(date);
        const cell = el('div', 'week-day' + ([0,6].includes(date.getDay()) ? ' is-weekend' : '') + (iso === todayIso ? ' is-today' : ''));
        const label = el('div', 'week-day-label');
        label.append(el('span', '', date.toLocaleDateString(undefined, { weekday:'short' })), el('span', 'dnum', String(date.getDate())));
        cell.append(label);
        events.filter(item => item.date === iso).sort((a, b) => (a.time || '99:99').localeCompare(b.time || '99:99')).forEach(item => {
          const past = item.date < todayIso || (item.date === todayIso && item.time && item.time < currentHHMM);
          const ev = el('button', 'event' + (past ? ' is-past' : ''));
          const time = el('span', 'event-time');
          if (item.time) time.textContent = formatTime(item.time); else time.append(el('span', 'allday', 'All day'));
          ev.append(time, el('span', '', item.title));
          if (item.notes) ev.title = item.notes;
          ev.addEventListener('click', () => openEvent(item.id));
          cell.append(ev);
        });
        const add = el('button', 'week-day-add', '+ Add');
        add.setAttribute('aria-label', 'Add event on ' + date.toLocaleDateString(undefined, { weekday:'long', month:'long', day:'numeric' }));
        add.addEventListener('click', () => openEvent(null, iso));
        cell.append(add);
        fragment.append(cell);
      });
      grid.replaceChildren(fragment);
    }

    function openEvent(id, dateIso) {
      const record = events.find(item => item.id === id);
      editingEventId = record?.id || null;
      $('event-form').reset();
      $('event-heading').textContent = record ? 'Edit event' : 'New event';
      $('e-title').value = record?.title || ''; $('e-title').setCustomValidity('');
      $('e-date').value = record?.date || dateIso || today();
      $('e-time').value = record?.time || '';
      $('e-notes').value = record?.notes || '';
      $('delete-event-btn').hidden = !record;
      showDialog('event-modal'); $('e-title').focus();
    }
    $('e-title').addEventListener('input', () => $('e-title').setCustomValidity(''));
    $('event-form').addEventListener('submit', event => {
      event.preventDefault();
      if (!$('event-modal').open) return;
      const title = $('e-title').value.trim();
      if (!title) { $('e-title').setCustomValidity('Give this event a name.'); $('e-title').reportValidity(); return; }
      const date = $('e-date').value;
      if (!date) { $('e-date').reportValidity(); return; }
      const existing = events.find(item => item.id === editingEventId);
      const record = { id:existing?.id || uid('evt'), title, date, time:$('e-time').value || '', notes:$('e-notes').value };
      if (existing) events[events.indexOf(existing)] = record; else events.push(record);
      persistEvents();
      // Jump the view to whichever week now holds this event.
      weekOffset = Math.round((mondayOf(parseLocalDate(date)) - mondayOf(new Date())) / (7 * DAY_MS));
      renderWeek(); closeDialog('event-modal');
    });
    $('delete-event-btn').addEventListener('click', () => {
      events = events.filter(item => item.id !== editingEventId);
      persistEvents(); renderWeek(); closeDialog('event-modal');
    });
    $('add-event-btn').addEventListener('click', () => openEvent(null));
    $('week-prev').addEventListener('click', () => { weekOffset -= 1; renderWeek(); });
    $('week-next').addEventListener('click', () => { weekOffset += 1; renderWeek(); });
    $('week-today-btn').addEventListener('click', () => { weekOffset = 0; renderWeek(); });

    load(); loadEvents(); render(); renderWeek(); renderQuote();
  })();
  </script>
</body>
</html>
